[theme]
base = "light"
primaryColor = "#1E6F5C"
backgroundColor = "#F3F1EC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17212B"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true
# Streamlit's own request protections stay on: cross-site request forgery and websocket origin checks.
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[browser]
gatherUsageStats = false
