# Render Blueprint for the FastAPI backend only. The three Streamlit apps are deployed separately
# (Streamlit Community Cloud); see "Deploying to the cloud" in README.md.
services:
  - type: web
    name: westbridge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Shared with the Streamlit apps (as the TRUSTED_FRONTEND_KEY secret) so the API can attribute their requests
      # to the signed-in employee's registered workstation. Copy the generated value from the Render dashboard.
      - key: TRUSTED_FRONTEND_KEY
        generateValue: true
      - key: SIMULATION_ENABLED
        value: "true"
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata
