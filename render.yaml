# Render Blueprint: the whole simulated platform as ONE Docker web service (FastAPI backend + the three Streamlit apps on
# loopback behind the gateway in deploy/gateway.py, which is the only public port). See docs/deployment.md.
#
# Nothing secret is stored in this file. Every value marked sync: false is entered in the Render dashboard.
# NOT YET DEPLOYED: this blueprint has not been run on Render. Follow docs/deployment.md, then run deploy/verify.py.
# Render supplies RENDER_EXTERNAL_URL automatically. Add PUBLIC_URL in the dashboard only if you attach a custom domain.
services:
  - type: web
    name: westbridge-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The four Python processes need roughly 0.6 GB at idle, so the 512 MB plans (including free) will not fit.
    plan: 1c-2g
    healthCheckPath: /healthz
    envVars:
      # persistent = records live in your PostgreSQL database and survive restarts and redeploys (needs DATABASE_URL).
      # demo       = throw-away synthetic data in a temporary SQLite file, reset on every start (refuses DATABASE_URL).
      - key: DEPLOY_MODE
        value: persistent
      # Connection URL of a managed PostgreSQL database that you create. The container's own disk is ephemeral.
      - key: DATABASE_URL
        sync: false
      # Output of `python -m deploy.make_secrets` (run it on your own machine; it prints to the terminal only).
      - key: SECRET_KEY
        sync: false
      - key: DEMO_PASSWORDS_JSON
        sync: false
      # Browser login (HTTP Basic) that protects the SOC dashboard and the simulation console.
      - key: ADMIN_UI_USER
        sync: false
      - key: ADMIN_UI_PASSWORD
        sync: false
      - key: SIMULATION_ENABLED
        value: "true"
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata
